<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPEC Badge Admin Submissions</title>
    <meta name="description" content="Individual PPEC badge interest submissions for the admin panel.">
    <link rel="stylesheet" href="styles.css?v=20260904d">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="PPEC Badge Interest home">
        <span class="brand-mark"><img src="assets/images/products/ppec-logo.png" alt=""></span>
        <span>Badge Admin</span>
      </a>
      <a class="admin-link" href="badges.html">Public form</a>
    </header>

    <main class="app-shell admin-shell">
      <nav class="admin-tabs" aria-label="Admin sections">
        <a href="admin.html">Dashboard</a>
        <a href="admin-calculations.html">Calculations</a>
        <a class="active" href="admin-submissions.html">Submissions</a>
      </nav>

      <section class="page-title">
        <p class="eyebrow">Private submissions</p>
        <h1>Individual submissions</h1>
        <p>Review each response, export the current CSV, or delete bogus entries.</p>
      </section>

      <section class="auth-panel" id="auth-panel">
        <button class="primary-button" id="sign-in-button" type="button">Sign in with Google</button>
        <button class="secondary-button hidden" id="sign-out-button" type="button">Sign out</button>
        <p class="form-message" id="auth-message" role="status" aria-live="polite"></p>
      </section>

      <section class="dashboard hidden" id="dashboard" aria-label="Individual submissions">
        <div class="dashboard-actions">
          <h2>Responses</h2>
          <button class="secondary-button" id="export-csv" type="button">Export CSV</button>
        </div>
        <div class="submission-list" id="submission-list"></div>
      </section>
    </main>

    <script type="module" src="admin.js?v=20260904b"></script>
  </body>
</html>
